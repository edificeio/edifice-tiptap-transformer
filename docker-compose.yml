version: "3.9"
services:
  content-transformer:
    user: "1000:1000"
    build:
      context: ./
      target: production
    environment:
      PORT: 3000
      METRICS_PORT: 3001
      NB_THREADS: 1
      MAX_BODY_SIZE: 2mb
    ports:
      - "3000:3000"
      - "3001:3001"
  tests:
    build:
      context: ./
      target: test
    command: pnpm test
  integration-tests:
    build:
      context: ./
      target: test
    # content-transformer's production image is distroless (no shell), so it can't
    # expose a Docker-native HEALTHCHECK. Wait for it from here instead, where a
    # shell/Node runtime is available.
    command: >
      sh -c "pnpm exec tsx scripts/wait-for-http.ts http://content-transformer:3000/healthcheck 60000
      && TRANSFORMER_URL=http://content-transformer:3000/transform pnpm run test:smoke"
    depends_on:
      - content-transformer
  load-tester:
    image: grafana/k6:master
    volumes:
      - ./test/src:/home/k6/src
      - ./test/data:/home/k6/data
    environment:
      ROOT_URL: http://content-transformer:3000
      DATA_ROOT_PATH: /home/k6/data
      DURATION: 120s
      VUS: 100
