version: "3.9"
services:
  content-transformer:
    user: "1000:1000"
    build:
      context: ./
      target: production
    environment:
      PORT: 3000
      METRICS_PORT: 3001
      NB_THREADS: 1
      MAX_BODY_SIZE: 2mb
    ports:
      - "3000:3000"
      - "3001:3001"
  # Generic CI image (no app Dockerfile involved) for running pnpm scripts against the
  # source, bind-mounted below — same pattern used across other Edifice Node repos.
  node:
    image: opendigitaleducation/node:18-alpine-pnpm
    working_dir: /home/node/app
    volumes:
      - ./:/home/node/app
      - ~/.pnpm:/.pnpm
  load-tester:
    image: grafana/k6:master
    volumes:
      - ./test/src:/home/k6/src
      - ./test/data:/home/k6/data
    environment:
      ROOT_URL: http://content-transformer:3000
      DATA_ROOT_PATH: /home/k6/data
      DURATION: 120s
      VUS: 100
